<!-- step3-doctor-section  -->
<!-- ----------------------------------------------------------------------------- -->
<section class="step3-doctor-section py-5">
  <div class="step3-doctor-container">
    <h1>Create Account</h1>
    <div class="image">
      <img src="../../../../../assets/images/logo_test.png" alt="logo" />
    </div>
    <p>Complete all steps to join Nesyan</p>
    <div
      class="step-indicator d-flex justify-content-between align-items-center w-50 my-3"
    >
      <div class="step1 passed">1</div>
      <div class="step2 active-step">2</div>
      <div class="step3">3</div>
    </div>
    <div class="form-container w-100">
      <h5>Professional Information</h5>
      <div class="form-container w-100">
        <p>Upload Graduation Degree</p>
        <form class="d-flex flex-column align-items-center w-100">
          <div
            class="upload-area d-flex flex-column justify-content-center align-items-center w-100 my-2"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave()"
            (drop)="onDrop($event)"
            (click)="fileInput.click()"
            [class.dragover]="isDragOver"
          >
            <i class="fa-solid fa-cloud-arrow-up fs-1 mb-2"></i>
            <p>Click to upload or drag and drop</p>
            <p class="m-0">PDF, JPG, PNG (MAX. 5MB)</p>
            <div class="form-group mt-4">
              <label for="degree" class="btn btn-primary text-white"
                >Select File</label
              >
              <input
                (change)="onFileSelect($event)"
                type="file"
                id="degree"
                name="degree"
                accept=".pdf, .jpg, .png"
                hidden
                #fileInput
              />
            </div>
          </div>
          <div class="note w-100 my-2 bg-primary-subtle py-2 px-1 rounded">
            <p class="text-primary fw-bold fs-5 text-center">
              Your degree will be verified by our team before you can access the
              full platform.
            </p>
          </div>
          <div
            class="buttons w-100 d-flex justify-content-between align-items-center shadow-lg"
          >
            <a routerLink="/register/step2" class="back">Back</a>
            <a class="next" routerLink="/home-doctor">Complete Registration</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
