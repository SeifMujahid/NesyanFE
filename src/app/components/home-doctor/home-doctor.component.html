    <div
      class="mid-part w-100 d-flex justify-content-between align-items-center fs-5 fw-medium text-primary border-bottom border-top border-primary py-2"

    <div

        <div class="d-flex justify-content-between align-items-center">

      <div class="patient">
        <p>Sarah Ali</p>
        <div>
          <span>Age:72</span>

        </div>

      <div class="patient">
        <p>Pep Guardiola</p>
        <div>
          <span>Age:55</span>
          <span class="stage2">Stage 2</span>
        </div>
      </div>
    </div>

        <p class="m-0">Mohamed Ahmed</p>

        <li>

        <li>
          <a routerLinkActive="active" routerLink="/home-doctor/statistics"

          >
        </li>
        <li>
          <a routerLinkActive="active" routerLink="/home-doctor/mind-games"

          >
        </li>
      </ul>
    </div>

    <div class="w-100">
      <router-outlet></router-outlet>
    </div>
